[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lender-package-builder"
dynamic = ["version"]
description = "Local-only tool that assembles organized PDF lender packages from ZIPs, folders, and documents."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Lender Package Builder" }]

dependencies = [
    "pypdf>=4.0,<6.0",
    "reportlab>=4.0,<5.0",
    "Pillow>=10.0,<12.0",
    "python-docx>=1.1,<2.0",
    "openpyxl>=3.1,<4.0",
    "beautifulsoup4>=4.12,<5.0",
    "extract-msg>=0.54,<0.56",
    "PySide6>=6.7,<7.0",
    "pypdfium2>=5.0,<6.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-qt>=4.4,<5.0",
]

[project.scripts]
lender-package-builder = "lender_package_builder.cli:main"

[project.gui-scripts]
lender-package-builder-gui = "lender_package_builder.app_entry:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "lender_package_builder._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_background_thread: run against a real QThread instead of the synchronous GUI test fake",
]
