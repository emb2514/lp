# Lender Package Builder - Stage 1 configuration
#
# These are defaults. Most values can be overridden per-run with
# command-line options (see README.md). Edit this file only if you want
# to change the defaults for every run.

[splitting]
# max_pages_per_part and max_size_mb_per_part are MAXIMUM CONSTRAINTS
# on one output PDF part, not target sizes to fill. A part is closed
# and a new one started as soon as adding the next COMPLETE source
# document would exceed either maximum -- parts are never padded,
# rearranged, or split to approach these numbers, so real parts will
# usually land well below them. A single source document that alone
# exceeds a maximum is kept intact in its own oversized part rather
# than being split (see README.md and splitting.py).
#
# These defaults were chosen from benchmark measurements (see
# benchmarks/results.md and README.md's "Choosing the output-part size
# defaults" section) balancing smooth local opening/searching against
# not fragmenting a package into an unmanageable number of parts. They
# are a starting point, not a universal guarantee for every machine or
# document mix -- change them freely for your environment.

# Maximum pages allowed in one output PDF part.
max_pages_per_part = 750

# Maximum size, in megabytes, allowed in one output PDF part.
max_size_mb_per_part = 100

[safety]
# Warn (but still proceed) when the expanded input exceeds this many
# megabytes, unless --allow-large-input is passed.
large_input_warning_mb = 2000

# Hard ceiling on expanded archive size, in megabytes, before refusing to
# proceed unless --allow-large-input is passed.
max_expanded_size_mb = 8000

# Hard ceiling on the number of entries inside all archives combined,
# before refusing to proceed unless --allow-large-input is passed.
max_archive_entries = 200000

# Required free disk space margin, as a multiple of the estimated
# expanded input size, before processing starts.
required_free_space_multiplier = 3.0

[conversion]
# Preferred office conversion backend order. "libreoffice" is used when
# a local LibreOffice (soffice) install is found. "office_com" is only
# ever attempted on Windows with Microsoft Office installed. "fallback"
# is the built-in pure-Python best-effort renderer.
office_backend_order = ["libreoffice", "office_com", "fallback"]

[logging]
level = "INFO"

[deduplication]
# RC2: content-aware duplicate detection (documents that are the same
# actual content despite different filenames, metadata, compression, or
# extra blank pages; PDF Portfolio attachments; standalone documents
# already contained inside a larger merged package). This is layered on
# top of, never a replacement for, the original exact-SHA-256 duplicate
# detection -- exact-byte duplicates are always caught first and are
# unaffected by this setting.
#
# Only ever removes a document automatically when the match is
# high-confidence by the app's own conservative rules (see
# Duplicate_Removal_Log.txt / Document_Version_Report.txt /
# Merged_Document_Overlap_Report.txt for exactly what was matched and
# why); anything less than fully confident is kept and flagged for your
# review instead of being removed. Set to false to fall back to the
# original exact-byte-duplicate-only behavior.
enable_content_aware_dedup = true
